services:
  - type: worker
    name: job-agent-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python runner.py --interval $POLL_INTERVAL_MIN
    envVars:
      - key: POLL_INTERVAL_MIN
        value: 15
      # Set these in Render dashboard (must be added as env secret vars):
      - key: GMAIL_ADDRESS
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: YOUR_NAME
        sync: false