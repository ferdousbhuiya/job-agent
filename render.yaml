services:
  - type: worker
    name: job-agent-bot
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: POLL_INTERVAL_MIN
        value: 0   # no auto-poll: only /scan in Telegram triggers a scan
      # Set these in Render dashboard as secret vars:
      - key: GMAIL_ADDRESS
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: YOUR_NAME
        sync: false